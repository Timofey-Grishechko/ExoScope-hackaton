server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: проксируем на Go-контейнер (имя "api" из docker-сети).
    # Переменная + resolver: nginx не падает при старте, если api ещё не поднялся.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://api:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Статика с хешами в именах: кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router (BrowserRouter): любой неизвестный путь отдаёт index.html,
    # иначе обновление страницы на /planets/xxx даст 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
