name: exoscope-demo

x-db-url: &db-url postgresql://exoscope_app:exoscope_app_dev@postgres:5432/exoscope?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exoscope
      POSTGRES_USER: exoscope
      POSTGRES_PASSWORD: exoscope_dev_pg
      APP_DB_USER: exoscope_app
      APP_DB_PASSWORD: exoscope_app_dev
      READONLY_DB_USER: exoscope_ro
      READONLY_DB_PASSWORD: exoscope_ro_dev
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U exoscope -d exoscope"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    shm_size: 256mb

  loader:
    build: ./backend
    command: ["/app/worker", "-once"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: ["/app/api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
